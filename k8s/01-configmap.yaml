# Generated from configs/docker/*.yaml via:
#   kubectl create configmap logflow-agent-configs -n logflow \
#     --from-file=configs/docker/collector-1.yaml --from-file=configs/docker/collector-2.yaml \
#     --from-file=configs/docker/edge-1.yaml --from-file=configs/docker/edge-2.yaml \
#     --dry-run=client -o yaml
# Re-run that and overwrite this file if the Docker configs change - don't hand-edit
# the `data:` block, it'll drift from configs/docker/ silently.
apiVersion: v1
data:
  collector-1.yaml: |
    # Collector-tier agent for the docker-compose topology. Receives batches
    # forwarded by the edge tier over gRPC and persists them to a durable WAL
    # file channel, then writes them out to rolling files on a named volume so
    # data survives a `docker compose restart`/container recreation.
    #
    # AGENT_ID is baked in at the container level (compose passes a distinct
    # config per collector); this file is the shared template copied into both
    # collector-1.yaml and collector-2.yaml with only agent_id differing.
    agent_id: collector-1
    http_addr: ":9101"
    drain_timeout: 30s

    channels:
      - name: main
        type: file
        dir: /app/data/wal
        capacity: 100000
        max_segment_bytes: 67108864 # 64MiB
        # Keep the on-disk WAL from growing without bound in a long-running
        # container: purge segments older than 1h or once the WAL exceeds 512MiB,
        # whichever comes first, checked every 30s.
        retention_max_age: 1h
        retention_max_bytes: 536870912
        compaction_interval: 30s

    sources:
      - name: from-edge
        type: grpc
        channel: main
        listen_addr: ":7000"

    sinks:
      - name: to-disk
        type: file
        channel: main
        dir: /app/data/out
        batch_size: 1000
        batch_linger: 250ms
        roll_max_bytes: 134217728 # 128MiB
        roll_interval: 5m
  collector-2.yaml: |
    # Collector-tier agent for the docker-compose topology. Receives batches
    # forwarded by the edge tier over gRPC and persists them to a durable WAL
    # file channel, then writes them out to rolling files on a named volume so
    # data survives a `docker compose restart`/container recreation.
    #
    # AGENT_ID is baked in at the container level (compose passes a distinct
    # config per collector); this file is the shared template copied into both
    # collector-1.yaml and collector-2.yaml with only agent_id differing.
    agent_id: collector-2
    http_addr: ":9101"
    drain_timeout: 30s

    channels:
      - name: main
        type: file
        dir: /app/data/wal
        capacity: 100000
        max_segment_bytes: 67108864 # 64MiB
        # Keep the on-disk WAL from growing without bound in a long-running
        # container: purge segments older than 1h or once the WAL exceeds 512MiB,
        # whichever comes first, checked every 30s.
        retention_max_age: 1h
        retention_max_bytes: 536870912
        compaction_interval: 30s

    sources:
      - name: from-edge
        type: grpc
        channel: main
        listen_addr: ":7000"

    sinks:
      - name: to-disk
        type: file
        channel: main
        dir: /app/data/out
        batch_size: 1000
        batch_linger: 250ms
        roll_max_bytes: 134217728 # 128MiB
        roll_interval: 5m
  edge-1.yaml: |
    # Edge-tier agent #1 for the docker-compose topology. Accepts events over
    # gRPC from a loadgen sidecar and load-balances forwarded batches round-robin
    # across both collectors, so killing either collector container only costs
    # the in-flight batches on that path - the other collector keeps absorbing
    # traffic and the load-balance group's retry/requeue logic recovers the rest.
    agent_id: edge-1
    http_addr: ":9100"
    drain_timeout: 30s

    channels:
      - name: main
        type: memory
        capacity: 20000
        shards: 4

    sources:
      - name: ingest
        type: grpc
        channel: main
        listen_addr: ":6000"

    sink_groups:
      - name: forward-to-collectors
        channel: main
        processor: load_balance
        selector: round_robin
        targets: ["collector-1:7000", "collector-2:7000"]
        parallelism: 4
        batch_size: 500
        batch_linger: 200ms
        in_flight_batches: 8
        max_retries: 5
        retry_backoff: 500ms
        compression: true
  edge-2.yaml: |
    # Edge-tier agent #2 for the docker-compose topology. Accepts events over
    # gRPC from a loadgen sidecar and load-balances forwarded batches round-robin
    # across both collectors, so killing either collector container only costs
    # the in-flight batches on that path - the other collector keeps absorbing
    # traffic and the load-balance group's retry/requeue logic recovers the rest.
    agent_id: edge-2
    http_addr: ":9100"
    drain_timeout: 30s

    channels:
      - name: main
        type: memory
        capacity: 20000
        shards: 4

    sources:
      - name: ingest
        type: grpc
        channel: main
        listen_addr: ":6000"

    sink_groups:
      - name: forward-to-collectors
        channel: main
        processor: load_balance
        selector: round_robin
        targets: ["collector-1:7000", "collector-2:7000"]
        parallelism: 4
        batch_size: 500
        batch_linger: 200ms
        in_flight_batches: 8
        max_retries: 5
        retry_backoff: 500ms
        compression: true
kind: ConfigMap
metadata:
  name: logflow-agent-configs
  namespace: logflow
