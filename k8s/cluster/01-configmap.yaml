# Generated by scripts/gen-k8s-cluster-config.py from configs/docker/cluster/
# (collector.yaml/edge.yaml with the peer names swapped for the StatefulSet's
# stable pod DNS names). Don't hand-edit the data: block.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logflow-cluster-configs
  namespace: logflow-cluster
data:
  collector.yaml: |
    # One member of a 3-node clustered collector group for
    # k8s/cluster (StatefulSet) (see the README's "Clustered collector (Raft)"
    # section). ALL THREE services run this same file: the only per-node values
    # come from the environment (NODE_ID, set from the pod name),
    # via environment-variable expansion at load time.
    #
    # Peer addresses are the compose service names - other nodes dial those.
    # listen_addr / client_listen_addr are what this node actually BINDS, kept
    # separate from the advertised peer addresses (BIND_IP is empty in a
    # container, i.e. bind all interfaces; it exists so the same file can also
    # be run as three local processes on 127.0.0.11-13 - see the README).
    agent_id: ${NODE_ID}
    http_addr: "${BIND_IP:-}:9101"
    drain_timeout: 30s

    channels:
      - name: main
        type: file
        dir: ${DATA_DIR:-/app/data}/wal
        capacity: 100000
        max_segment_bytes: 67108864 # 64MiB
        cluster:
          node_id: ${NODE_ID}
          listen_addr: "${BIND_IP:-}:8301"
          client_listen_addr: "${BIND_IP:-}:8311"
          data_dir: ${DATA_DIR:-/app/data}/raft
          peers:
            - {id: collector-0, addr: "collector-0.collector-raft:8301", client_addr: "collector-0.collector-raft:8311"}
            - {id: collector-1, addr: "collector-1.collector-raft:8301", client_addr: "collector-1.collector-raft:8311"}
            - {id: collector-2, addr: "collector-2.collector-raft:8301", client_addr: "collector-2.collector-raft:8311"}
          election_timeout_min: 300ms
          election_timeout_max: 600ms
          heartbeat_interval: 100ms
          apply_timeout: 5s
          batch_size: 200
          batch_linger: 50ms
          # Keep the Raft log bounded (see "Log compaction": a member that
          # catches up by snapshot lacks the events it skipped).
          snapshot_threshold: 5000

    sources:
      - name: from-edge
        type: grpc
        channel: main
        listen_addr: "${BIND_IP:-}:7000"

    # Only the current leader's sink writes output (see /stats).
    sinks:
      - name: to-disk
        type: file
        channel: main
        dir: ${DATA_DIR:-/app/data}/out
        batch_size: 500
        batch_linger: 200ms
        roll_max_bytes: 134217728
        roll_interval: 5m
  edge.yaml: |
    # Edge agent for the k8s cluster overlay: spreads batches over all three
    # cluster members (any member accepts writes and forwards to its Raft
    # leader), and routes around a dead one.
    agent_id: edge-cluster
    http_addr: ":9100"
    drain_timeout: 30s

    channels:
      - {name: main, type: memory, capacity: 20000, shards: 4}

    sources:
      - {name: ingest, type: grpc, channel: main, listen_addr: ":6000"}

    sink_groups:
      - name: forward-to-cluster
        channel: main
        processor: load_balance
        selector: round_robin
        targets: ["collector-0.collector-raft:7000", "collector-1.collector-raft:7000", "collector-2.collector-raft:7000"]
        parallelism: 3
        batch_size: 500
        batch_linger: 200ms
        in_flight_batches: 8
        max_retries: 10
        retry_backoff: 500ms
        compression: true
