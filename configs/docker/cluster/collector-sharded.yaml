# One member of a 3-node x 2-shard sharded clustered collector for
# docker-compose.cluster.yml (COLLECTOR_CFG=collector-sharded.yaml) (see the README's "Sharding across multiple independent
# Raft groups" section). ALL THREE services run this same file: the only per-node values
# come from the environment (NODE_ID, set per service in the compose file),
# via environment-variable expansion at load time.
#
# Peer addresses are the compose service names - other nodes dial those.
# listen_addr / client_listen_addr are what this node actually BINDS, kept
# separate from the advertised peer addresses (BIND_IP is empty in a
# container, i.e. bind all interfaces; it exists so the same file can also
# be run as three local processes on 127.0.0.11-13 - see the README).
agent_id: ${NODE_ID}
http_addr: "${BIND_IP:-}:9101"
drain_timeout: 30s

channels:
  - name: main
    type: file
    # shard-0 / shard-1 subdirectories are created under this per shard.
    dir: ${DATA_DIR:-/app/data}/wal
    capacity: 100000
    max_segment_bytes: 67108864
    sharded_cluster:
      shards:
        - node_id: ${NODE_ID}
          listen_addr: "${BIND_IP:-}:8301"
          client_listen_addr: "${BIND_IP:-}:8311"
          data_dir: ${DATA_DIR:-/app/data}/raft-shard-0
          peers:
            - {id: cluster-1, addr: "cluster-1:8301", client_addr: "cluster-1:8311"}
            - {id: cluster-2, addr: "cluster-2:8301", client_addr: "cluster-2:8311"}
            - {id: cluster-3, addr: "cluster-3:8301", client_addr: "cluster-3:8311"}
          election_timeout_min: 300ms
          election_timeout_max: 600ms
          heartbeat_interval: 100ms
          apply_timeout: 5s
          batch_size: 200
          batch_linger: 50ms
          snapshot_threshold: 5000
        - node_id: ${NODE_ID}
          listen_addr: "${BIND_IP:-}:8302"
          client_listen_addr: "${BIND_IP:-}:8312"
          data_dir: ${DATA_DIR:-/app/data}/raft-shard-1
          peers:
            - {id: cluster-1, addr: "cluster-1:8302", client_addr: "cluster-1:8312"}
            - {id: cluster-2, addr: "cluster-2:8302", client_addr: "cluster-2:8312"}
            - {id: cluster-3, addr: "cluster-3:8302", client_addr: "cluster-3:8312"}
          election_timeout_min: 300ms
          election_timeout_max: 600ms
          heartbeat_interval: 100ms
          apply_timeout: 5s
          batch_size: 200
          batch_linger: 50ms
          snapshot_threshold: 5000

sources:
  - name: from-edge
    type: grpc
    channel: main
    listen_addr: "${BIND_IP:-}:7000"

sinks:
  - name: to-disk
    type: file
    channel: main
    dir: ${DATA_DIR:-/app/data}/out
    batch_size: 500
    batch_linger: 200ms
    roll_max_bytes: 134217728
    roll_interval: 5m
