# Same shape as edge-agent.yaml, but the gRPC sink authenticates to the
# collector with a client certificate (mTLS) and a bearer token.
agent_id: secure-edge
http_addr: ":9100"

channels:
  - name: main
    type: memory
    capacity: 20000
    shards: 4

sources:
  - name: app-log
    type: filetail
    channel: main
    path: /var/log/app/app.log
    poll_interval: 300ms

sinks:
  - name: forward-to-collector
    type: grpc
    channel: main
    target_addr: 127.0.0.1:7000
    batch_size: 500
    batch_linger: 200ms
    parallelism: 2
    in_flight_batches: 8
    max_retries: 5
    retry_backoff: 500ms
    compression: true
    auth_token: "s3cret-demo-token"
    tls:
      enabled: true
      ca_file: certs/ca-cert.pem
      cert_file: certs/client-cert.pem
      key_file: certs/client-key.pem
      server_name: localhost
