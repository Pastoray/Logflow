# A 4th node, started standalone and added LIVE to the 3-node group
# described by collector-{1,2,3}.yaml - no restart of any of those three
# nodes required. See the main README's "Live membership changes" section.
#
# Unlike collector-{1,2,3}.yaml, this file has no cluster.peers at all:
# cluster.joining is true, so this node starts up not knowing the rest of
# the group (or even that it's part of one yet), serving RPCs but never
# calling an election itself (see internal/cluster's "Membership changes"
# doc comment). It's only actually part of the cluster - caught up,
# replicated to, and counted toward quorum - once an operator calls
#
#   curl -X POST 'http://127.0.0.1:9201/cluster/add?id=collector-4&addr=127.0.0.1:8304&client_addr=127.0.0.1:8314'
#
# against any already-running member (any node forwards to the leader).
agent_id: collector-4
http_addr: "127.0.0.1:9204"
drain_timeout: 10s

channels:
  - name: main
    type: file
    dir: data/cluster-demo/collector-4/wal
    capacity: 50000
    max_segment_bytes: 67108864 # 64MiB
    cluster:
      joining: true
      self:
        id: collector-4
        addr: "127.0.0.1:8304"
        client_addr: "127.0.0.1:8314"
      data_dir: data/cluster-demo/collector-4/raft
      election_timeout_min: 150ms
      election_timeout_max: 300ms
      heartbeat_interval: 50ms
      apply_timeout: 5s
      batch_size: 200
      batch_linger: 50ms

sources:
  - name: from-edge
    type: grpc
    channel: main
    listen_addr: "127.0.0.1:7004"

sinks:
  - name: to-disk
    type: file
    channel: main
    dir: data/cluster-demo/collector-4/out
    batch_size: 500
    batch_linger: 200ms
    roll_max_bytes: 134217728
    roll_interval: 5m
