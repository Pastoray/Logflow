# One physical node of a 3-node x 2-shard sharded clustered collector
# (see the main README's "Sharding across multiple independent Raft
# groups" section). All three collector-N.yaml files in this directory
# describe the same deployment: each physical node participates in BOTH
# shard-0's and shard-1's Raft group as one of their 3 members - two
# completely independent Raft groups running side by side on the same 3
# processes, each with its own leader, term, and log.
#
# Only agent_id, http_addr, the gRPC listen_addr, the file channel's dir,
# and each shard's node_id differ between the three files - the peer
# lists and timing are identical everywhere, because every node needs the
# same view of both groups.
#
# A client (loadgen, a gRPC source upstream) can write to ANY node on its
# gRPC listen_addr; ShardedChannel.Put picks a shard (round-robin here -
# no shard_key_header is set), and that shard's own Raft group does the
# usual "I'm leader, apply it" or "forward to whoever is" dance,
# completely independently of the other shard. See this node's /stats for
# live per-shard leader/term/state (shard[0]_* / shard[1]_*).
agent_id: collector-1
http_addr: "127.0.0.1:9301"
drain_timeout: 10s

channels:
  - name: main
    type: file
    # buildShardedChannel appends shard-0/shard-1 subdirectories under
    # this per shard - no need to spell those out here.
    dir: data/sharded-demo/collector-1/wal
    capacity: 50000
    max_segment_bytes: 67108864 # 64MiB
    sharded_cluster:
      shards:
        - node_id: collector-1
          data_dir: data/sharded-demo/collector-1/raft-shard-0
          peers:
            - id: collector-1
              addr: "127.0.0.1:8401" # shard-0 Raft protocol
              client_addr: "127.0.0.1:8411" # shard-0 client-write forwarding
            - id: collector-2
              addr: "127.0.0.1:8402"
              client_addr: "127.0.0.1:8412"
            - id: collector-3
              addr: "127.0.0.1:8403"
              client_addr: "127.0.0.1:8413"
          election_timeout_min: 150ms
          election_timeout_max: 300ms
          heartbeat_interval: 50ms
          apply_timeout: 5s
          batch_size: 200
          batch_linger: 50ms
        - node_id: collector-1
          data_dir: data/sharded-demo/collector-1/raft-shard-1
          peers:
            - id: collector-1
              addr: "127.0.0.1:8501" # shard-1 Raft protocol
              client_addr: "127.0.0.1:8511" # shard-1 client-write forwarding
            - id: collector-2
              addr: "127.0.0.1:8502"
              client_addr: "127.0.0.1:8512"
            - id: collector-3
              addr: "127.0.0.1:8503"
              client_addr: "127.0.0.1:8513"
          election_timeout_min: 150ms
          election_timeout_max: 300ms
          heartbeat_interval: 50ms
          apply_timeout: 5s
          batch_size: 200
          batch_linger: 50ms

sources:
  - name: from-edge
    type: grpc
    channel: main
    listen_addr: "127.0.0.1:7101"

sinks:
  - name: to-disk
    type: file
    channel: main
    dir: data/sharded-demo/collector-1/out
    batch_size: 500
    batch_linger: 200ms
    roll_max_bytes: 134217728
    roll_interval: 5m
